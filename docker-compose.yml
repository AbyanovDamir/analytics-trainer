version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trainer-postgres
    environment:
      POSTGRES_DB: trainer
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trainer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./java-backend
    container_name: trainer-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/trainer
      DB_USER: admin
      DB_PASSWORD: secret
      CHECKER_URL: http://checker:8081
    restart: unless-stopped

  checker:
    build: ./checker
    container_name: trainer-checker
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
